name: Live admin

# Údržba živých dat turnaje servisním účtem github-deploy (role Cloud
# Datastore User). Spouští se ručně; úlohy jsou v scripts/live-admin.mjs.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Úloha (check nic nemění)'
        required: true
        default: check
        type: choice
        options: [check, tees, games, index, schedule, bonuses, double]

concurrency:
  group: live-admin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Spustit úlohu
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          [ -n "$SERVICE_ACCOUNT" ] || { echo "::error::Chybí secret FIREBASE_SERVICE_ACCOUNT (docs/setup-firebase.md, krok 5)."; exit 1; }
          key="$RUNNER_TEMP/service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          status=0
          node scripts/live-admin.mjs "${{ inputs.task }}" || status=$?
          rm -f "$key"
          if [ $status -ne 0 ]; then
            echo "::error::Úloha selhala. Servisní účet github-deploy potřebuje roli Cloud Datastore User (docs/setup-firebase.md, krok 5.3)."
            exit $status
          fi
