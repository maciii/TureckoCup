name: Build & Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Starší běh vývojové větve se zruší. Na main ne - zrušení by mohlo přerušit
# rozběhnuté nasazení; běhy main se řadí za sebe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Kontrola typů
        run: npm run typecheck
      - name: Testy výpočtů
        run: npm run test
      - name: Kontrola formátování
        run: npm run format:check

      # Vypíše, co z konfigurace Firebase dorazilo (jen délky, ne hodnoty).
      - name: Kontrola konfigurace Firebase
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
        run: |
          missing=0
          for name in API_KEY AUTH_DOMAIN PROJECT_ID APP_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "VITE_FIREBASE_$name: vyplněno, ${#value} znaků"
            else
              echo "VITE_FIREBASE_$name: CHYBÍ"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "Aplikace se nasadí, ale ukáže hlášku 'Turnaj není připojený'."
            echo "Doplň hodnoty v Settings -> Secrets and variables -> Actions (docs/setup-firebase.md)."
          fi

      - name: Build
        run: npm run build
        env:
          # Firebase Hosting servíruje z kořene domény <projekt>.web.app.
          BASE_PATH: /
          VITE_COURSES_URL: ${{ vars.VITE_COURSES_URL }}
          VITE_TOURNAMENT_ID: ${{ vars.VITE_TOURNAMENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}

      - name: Uložit build pro nasazení
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # Telefony: iOS profily ve skutečném WebKitu (engine Safari), Android v Chromiu.
  # Oficiální image Playwrightu má prohlížeče i systémové knihovny, instalace
  # přes apt v běžném runneru trvala desítky minut.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: E2E na iPhonu a Androidu (ukázkový režim)
        run: npx playwright test
      - name: E2E proti emulátorům Firebase (produkční datová vrstva)
        run: npm run test:e2e:firebase
      - name: Záznam selhání
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  # Security rules v emulátoru Firestoru (potřebuje Javu, runner ji má).
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Testy security rules
        run: npm run test:rules

  # Nasazení na Firebase Hosting (plán Spark, zdarma, i ze soukromého repozitáře).
  deploy:
    needs: [build, e2e, rules]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Kontrola přístupu k Firebase Hosting
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          missing=0
          [ -n "$SERVICE_ACCOUNT" ] || { echo "::error::Chybí secret FIREBASE_SERVICE_ACCOUNT (docs/setup-firebase.md, krok 5)."; missing=1; }
          [ -n "$PROJECT_ID" ] || { echo "::error::Chybí secret VITE_FIREBASE_PROJECT_ID (docs/setup-firebase.md, krok 4)."; missing=1; }
          exit $missing
      - name: Nasadit na Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
