<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1c14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Turecko Cup" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Turecko Cup 26</title>
    <!-- Barevné schéma se nastaví dřív, než se vykreslí první pixel. Klíč
         i barvy musí sedět s `src/theme.tsx`; hlídá to `src/theme.test.ts`. -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('tureckocup.theme.v1')
        } catch (e) {
          /* privátní režim - spadneme na nastavení systému */
        }
        if (theme !== 'dark' && theme !== 'light') {
          theme =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        }
        document.documentElement.setAttribute('data-theme', theme)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'light' ? '#eef2ea' : '#0f1c14')
      })()
    </script>
    <style>
      :root {
        --boot-bg: #0f1c14;
        --boot-text: #eef4ef;
        --boot-dim: #9fb4a6;
      }
      :root[data-theme='light'] {
        --boot-bg: #eef2ea;
        --boot-text: #14241a;
        --boot-dim: #5a6f60;
      }
      body {
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 8px;
        padding: 24px;
        text-align: center;
      }
      .boot-title {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
      }
      .boot-note {
        margin: 0;
        font-size: 14px;
        color: var(--boot-dim);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <p class="boot-title">Turecko Cup 26</p>
        <p class="boot-note" id="boot-note">Načítám…</p>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var note = document.getElementById('boot-note')
        if (note) note.textContent = 'Aplikaci se nepodařilo načíst, zkus obnovit stránku.'
      }, 6000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
