<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0a5c32" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Turecko Cup" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Turecko Cup 26</title>
    <style>
      :root {
        --boot-bg: #faf9f5;
        --boot-text: #151a16;
        --boot-dim: #9a9d90;
      }
      body {
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 8px;
        padding: 24px;
        text-align: center;
      }
      .boot-title {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
      }
      .boot-note {
        margin: 0;
        font-size: 14px;
        color: var(--boot-dim);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <p class="boot-title">Turecko Cup 26</p>
        <p class="boot-note" id="boot-note">Načítám…</p>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var note = document.getElementById('boot-note')
        if (note)
          note.textContent = 'Aplikaci se nepodařilo načíst, zkus obnovit stránku.'
      }, 6000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
